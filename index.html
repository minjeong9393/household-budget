<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCMJ 가계부</title>
<meta name="description" content="광고 없이 쓰는 부부 가계부. 카테고리 예산과 다음 달 이월, 대출 잔액, 매달 쌓이는 저축을 한 화면에서. 엑셀로 내려받고 남편과 실시간으로 함께 기록합니다.">
<meta name="theme-color" content="#2f6bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SCMJ 가계부">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<style>
/* ------------------------------------------------------------------ *
 *  styles.css — 밝은 단일 테마 · 모바일 우선 · 900px 부터 PC 대시보드
 * ------------------------------------------------------------------ */

:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --ink: #131c31;
  --ink2: #56637c;
  --ink3: #8b97ab;
  --line: #e8edf5;
  --line2: #dfe6f1;
  --accent: #2f6bff;
  --accent-dark: #1f52d0;
  --accent-soft: #ecf1ff;
  --green: #0e9f6e;
  --green-soft: #e6f7f0;
  --red: #e05361;
  --red-soft: #fdeef0;
  --amber: #f59e0b;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(19, 28, 49, .04), 0 10px 26px rgba(19, 28, 49, .06);
  --font: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
    "맑은 고딕", "Noto Sans KR", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, p, ul, li { margin: 0; padding: 0; }
button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 16px; color: inherit; }
.ic { display: inline-block; vertical-align: -3px; flex: none; }
.muted { color: var(--ink3); font-size: 12.5px; }
.pos { color: var(--green); }
.neg { color: var(--red); }
.nowrap { white-space: nowrap; }

/* ---------- 앱바 ---------- */
.appbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  height: 60px; padding: 0 16px;
  background: rgba(255, 255, 255, .92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.bwrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  border-radius: 11px; background: linear-gradient(140deg, #2f6bff, #6b93ff);
  color: #fff; font-weight: 800; font-size: 16px;
  box-shadow: 0 4px 10px rgba(47, 107, 255, .28);
}
.logo.sm { width: 28px; height: 28px; border-radius: 9px; font-size: 14px; }
.btxt { min-width: 0; }
.bname { font-size: 16.5px; font-weight: 800; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bsub { font-size: 11.5px; color: var(--ink3); margin-top: 1px; }
.bacts { display: flex; align-items: center; gap: 6px; flex: none; }
.iconbtn {
  width: 40px; height: 40px; display: grid; place-items: center;
  border-radius: 12px; color: var(--ink2);
}
.iconbtn:active { background: var(--line); }
.iconbtn.tiny { width: 26px; height: 26px; font-size: 13px; color: var(--ink3); }
.syncpill {
  display: inline-flex; align-items: center; gap: 5px;
  height: 32px; padding: 0 11px; border-radius: 999px;
  background: var(--bg); border: 1px solid var(--line);
  font-size: 12.5px; font-weight: 700; color: var(--ink2);
}
.syncpill .sicon { font-size: 12px; }
.syncpill[data-status="live"], .syncpill[data-status="sync"] { background: var(--accent-soft); border-color: #d6e1ff; color: var(--accent-dark); }
.syncpill[data-status="offline"] { background: var(--red-soft); border-color: #f8d7db; color: var(--red); }
.appbar .addbtn { display: none; }

/* ---------- 기본 배치 ---------- */
.shell { display: block; }
#view { padding: 14px 14px 96px; }
.sidenav { display: none; }
.card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px; margin-bottom: 12px;
}
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.card-head h2 { font-size: 14.5px; font-weight: 800; letter-spacing: -.2px; }
.linkbtn { font-size: 12.5px; font-weight: 700; color: var(--accent); padding: 4px 2px; white-space: nowrap; }
.linkbtn.more { display: block; width: 100%; text-align: center; padding: 12px 0 2px; border-top: 1px solid var(--line); margin-top: 8px; }

/* ---------- 월 이동 ---------- */
.monthbar {
  display: flex; align-items: center; gap: 4px;
  padding: 2px 2px 12px;
}
.mb-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; color: var(--ink2); }
.mb-btn:active { background: var(--line); }
.mb-label { font-size: 17px; font-weight: 800; letter-spacing: -.4px; padding: 0 4px; }
.mb-today {
  margin-left: auto; height: 30px; padding: 0 12px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line2); color: var(--ink2);
  font-size: 12px; font-weight: 700;
}
.mb-today:active { background: var(--accent-soft); color: var(--accent-dark); }

/* ---------- 히어로 ---------- */
.hero {
  background:
    radial-gradient(120% 90% at 100% 0%, rgba(47, 107, 255, .10), transparent 60%),
    linear-gradient(160deg, #ffffff, #f7f9ff);
  border: 1px solid #e6ecfa;
  padding: 18px 18px 16px;
}
.hero-k { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink2); }
.hero-amt { font-size: 32px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.15; margin: 4px 0 2px; }
.hero-amt.pos { color: var(--green); }
.hero-amt.neg { color: var(--red); }
.hero-sub { font-size: 12.5px; color: var(--ink3); }
.hero-side {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
  margin-top: 14px; padding-top: 13px; border-top: 1px dashed var(--line2);
}
.hs-row { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.hs-row span { font-size: 11.5px; color: var(--ink3); font-weight: 600; }
.hs-row b { font-size: 13.5px; font-weight: 800; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- 게이지 ---------- */
.goalcard .goal-line { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.goalcard .goal-line b { font-size: 17px; font-weight: 800; }
.goalcard .goal-line span { font-size: 12.5px; color: var(--ink3); }
.goalcard .goal-line em { font-style: normal; font-size: 12px; font-weight: 700; margin-left: auto; }
.bar { height: 7px; border-radius: 999px; background: #eef1f7; overflow: hidden; }
.bar.big { height: 9px; margin-top: 6px; }
.bar .fill { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .25s ease; }
.bar .fill.income { background: var(--green); }
.bar .fill.over { background: var(--red); }
.empty-line { font-size: 12.5px; color: var(--ink3); padding: 6px 0 2px; }

/* ---------- 계획 vs 실제 ---------- */
.planrow { margin-bottom: 12px; }
.planrow:last-child { margin-bottom: 0; }
.pl-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.pl-top span { font-size: 12.5px; font-weight: 700; color: var(--ink2); }
.pl-top b { font-size: 13.5px; font-weight: 800; }
.pl-top em { font-style: normal; color: var(--ink3); font-weight: 600; }

/* ---------- 카테고리 표 ---------- */
.ptable-head { display: none; }
.prow {
  display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px;
  padding: 11px 0; border-top: 1px solid var(--line);
}
.prow .pname { order: 1; flex: 1 1 auto; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; min-width: 0; }
.prow .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.rolltag {
  font-style: normal; font-size: 10px; font-weight: 700; color: var(--accent-dark);
  background: var(--accent-soft); border-radius: 6px; padding: 1px 5px;
}
.prow .pnum { font-size: 12px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.prow .pnum b { font-weight: 800; }
.prow .pnum:nth-child(2), .prow .pnum:nth-child(3) { display: none; }
.prow .pnum:nth-child(6) { order: 2; margin-left: auto; font-size: 14px; font-weight: 800; color: var(--ink); }
.prow .pnum:nth-child(4) { order: 4; }
.prow .pnum:nth-child(5) { order: 5; }
.prow .pnum:nth-child(4)::before { content: "한도 "; }
.prow .pnum:nth-child(5)::before { content: "실제 "; }
.prow .pnum.carry { color: var(--accent-dark); }
.prow .pbar-mini { order: 3; flex: 1 0 100%; margin-top: 6px; height: 4px; border-radius: 999px; background: #eef1f7; overflow: hidden; }
.prow .pbar-mini i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.prow.ptotal { border-top: 1.5px solid var(--line2); font-weight: 800; }
.prow.ptotal .pname { font-weight: 800; }
.prow.ptotal .pnum { color: var(--ink); font-size: 13px; font-weight: 700; }
.prow.ptotal .pbar-mini { display: none; }
.table-note { font-size: 11.5px; color: var(--ink3); margin-top: 10px; line-height: 1.5; }

/* ---------- 거래 ---------- */
.txsum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.tchip { background: var(--card); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); }
.tchip span { display: block; font-size: 11.5px; color: var(--ink3); font-weight: 600; }
.tchip b { font-size: 15px; font-weight: 800; letter-spacing: -.4px; }
.txpanel { padding: 15px 14px 8px; }
.txtools { display: flex; gap: 7px; margin-bottom: 8px; }
.searchbox { position: relative; flex: 1 1 100%; display: flex; align-items: center; }
.txfilters {
  display: flex; align-items: center; gap: 7px; margin-bottom: 10px;
  overflow-x: auto; padding-bottom: 2px; scrollbar-width: none;
}
.txfilters::-webkit-scrollbar { display: none; }
.txfilters .seg { flex: none; }
.txfilters .minisel { flex: 1 1 0; min-width: 0; max-width: none; }
.txfilters .linkbtn { flex: none; }
.searchbox .ic { position: absolute; left: 11px; color: var(--ink3); }
.txsearch {
  width: 100%; height: 38px; border-radius: 11px; border: 1px solid var(--line);
  background: #fafbfe; padding: 0 12px 0 36px; font-size: 14px; outline: none;
}
.txsearch:focus { border-color: #c7d6ff; background: #fff; }
.seg { display: inline-flex; background: #f1f4fa; border-radius: 11px; padding: 3px; gap: 2px; }
.seg.small .segbtn { font-size: 12.5px; padding: 5px 10px; }
.seg.wide { display: flex; margin: 2px 0 10px; }
.seg.wide .segbtn { flex: 1; padding: 10px 0; font-size: 14.5px; }
.segbtn { border-radius: 9px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--ink2); }
.segbtn.on { background: #fff; color: var(--accent-dark); box-shadow: 0 1px 3px rgba(19, 28, 49, .10); }
.minisel {
  height: 34px; border-radius: 10px; border: 1px solid var(--line);
  background: #fafbfe; padding: 0 6px; font-size: 12.5px; color: var(--ink2); max-width: 122px;
}
.txcards { display: block; }
.daygroup { margin-bottom: 6px; }
.dayhead {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 8px 2px 4px; font-size: 11.5px; color: var(--ink3); font-weight: 700;
}
.dayhead em { font-style: normal; font-variant-numeric: tabular-nums; }
.txrow {
  width: 100%; display: flex; align-items: center; gap: 9px;
  padding: 10px 2px; border-top: 1px solid var(--line); text-align: left;
}
.txrow:active { background: #f8faff; }
.txrow .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.txmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.txmain b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txmain em { font-style: normal; font-size: 11.5px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txamt { font-size: 14.5px; font-weight: 800; font-variant-numeric: tabular-nums; flex: none; }
.txempty { padding: 22px 0 18px; text-align: center; }
.txempty p { font-size: 13px; color: var(--ink3); margin-bottom: 12px; }
.txtablewrap { display: none; }
.tag { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
.tag.out { background: var(--red-soft); color: var(--red); }
.tag.in { background: var(--green-soft); color: var(--green); }

/* ---------- 대출 ---------- */
.loanhero { background: linear-gradient(160deg, #ffffff, #f6f8ff); border: 1px solid #e6ecfa; }
.loanhero .hero-amt { font-size: 31px; }
.loanmeta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.loanmeta span { display: block; font-size: 11.5px; color: var(--ink3); font-weight: 600; }
.loanmeta b { font-size: 13px; font-weight: 800; letter-spacing: -.3px; white-space: nowrap; }
.repayline { margin-top: 14px; }
.repayline > span { font-size: 12px; color: var(--ink2); font-weight: 600; }
.repayline b { color: var(--green); font-weight: 800; }
.loanrow { padding: 13px 0; border-top: 1px solid var(--line); }
.loanrow:first-of-type { border-top: 0; }
.loanrow-top { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
.lnm b { display: block; font-size: 15px; font-weight: 800; letter-spacing: -.3px; }
.lnm em { display: block; font-style: normal; font-size: 11.5px; color: var(--ink3); margin-top: 2px; }
.lamt { text-align: right; flex: none; }
.lamt b { display: block; font-size: 15px; font-weight: 800; letter-spacing: -.3px; }
.lamt em { display: block; font-style: normal; font-size: 11.5px; color: var(--ink3); }
.loanmemo { font-size: 12px; color: var(--ink3); margin-top: 7px; }
.loanacts { display: flex; gap: 7px; margin-top: 10px; }
.loanthist { margin-top: 10px; }
.loanthist summary {
  font-size: 12px; font-weight: 700; color: var(--ink2); cursor: pointer;
  padding: 6px 0; list-style: none;
}
.loanthist summary::-webkit-details-marker { display: none; }
.loanthist summary::before { content: "▸ "; color: var(--ink3); }
.loanthist[open] summary::before { content: "▾ "; }
.loanthist ul { list-style: none; padding: 4px 0 0; }
.loanthist li {
  display: flex; justify-content: space-between; gap: 10px;
  font-size: 12px; color: var(--ink2); padding: 5px 0; border-top: 1px dashed var(--line);
}
.loanthist li b { font-weight: 700; white-space: nowrap; }
.loanthist li em { font-style: normal; color: var(--ink3); font-weight: 500; }

/* ---------- 저축 ---------- */
.scards { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.card.mini { padding: 13px 14px; margin: 0; }
.card.mini span { display: block; font-size: 11.5px; color: var(--ink3); font-weight: 600; }
.card.mini b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -.5px; margin: 3px 0 2px; }
.card.mini em { font-style: normal; font-size: 11px; color: var(--ink3); }
.sgap { height: 12px; }
.chartcard .chart { display: flex; gap: 5px; align-items: stretch; height: 176px; padding-top: 6px; overflow-x: auto; }
.cbar { flex: 1 0 30px; display: flex; flex-direction: column; align-items: center; min-width: 30px; }
.cbar .cval { font-size: 9.5px; font-weight: 700; color: var(--ink2); height: 14px; white-space: nowrap; }
.cbar .ctrack { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.cbar .ctrack i { display: block; width: 62%; max-width: 26px; border-radius: 7px 7px 3px 3px; background: var(--accent); min-height: 3px; }
.cbar .ctrack i.pos { background: linear-gradient(180deg, #34c48d, #0e9f6e); }
.cbar .ctrack i.neg { background: linear-gradient(180deg, #f3808c, #e05361); }
.cbar .clab { font-size: 10.5px; color: var(--ink3); font-weight: 700; padding-top: 6px; }
.stwrap { overflow-x: auto; }
.stable { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.stable th {
  font-size: 10.5px; color: var(--ink3); font-weight: 700; text-align: left;
  padding: 6px 3px; border-bottom: 1px solid var(--line2); white-space: nowrap;
}
.stable td { padding: 9px 3px; border-bottom: 1px solid var(--line); white-space: nowrap; letter-spacing: -.2px; }
.stable tr.cur td { background: #f7faff; font-weight: 700; }
.stable .num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- 하단 탭 · FAB ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgba(255, 255, 255, .96); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0; color: var(--ink3); }
.tab span { font-size: 10.5px; font-weight: 700; }
.tab.on { color: var(--accent); }
.fab {
  position: fixed; right: 16px; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 31;
  width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(140deg, #2f6bff, #5b87ff);
  box-shadow: 0 10px 22px rgba(47, 107, 255, .38);
}
.fab:active { transform: scale(.96); }
body.sheet-open .fab { display: none; }
body.sheet-open { overflow: hidden; }

/* ---------- 버튼 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  height: 44px; padding: 0 16px; border-radius: 12px;
  background: #f1f4fa; color: var(--ink); font-weight: 700; font-size: 14px;
  border: 1px solid transparent;
}
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 6px 14px rgba(47, 107, 255, .24); }
.btn.primary:active { background: var(--accent-dark); }
.btn.soft { background: var(--accent-soft); color: var(--accent-dark); }
.btn.ghost { background: #fff; border-color: var(--line2); color: var(--ink2); }
.btn.danger { color: var(--red); }
.btn.primary.danger { background: var(--red); color: #fff; box-shadow: none; }
.btn.sm { height: 34px; padding: 0 11px; font-size: 12.5px; border-radius: 10px; }
.btn.wide { width: 100%; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  height: 32px; padding: 0 12px; border-radius: 999px;
  background: #f1f4fa; color: var(--ink2); font-size: 12.5px; font-weight: 700;
  border: 1px solid transparent;
}
.chip.on { background: var(--accent-soft); color: var(--accent-dark); border-color: #cfdcff; }
.toggle {
  height: 28px; padding: 0 9px; border-radius: 8px; font-size: 11.5px; font-weight: 800;
  background: #f1f4fa; color: var(--ink3);
}
.toggle.on { background: var(--accent-soft); color: var(--accent-dark); }

/* ---------- 시트 ---------- */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(14, 21, 38, .42); animation: fadein .15s ease; }
.sheetwrap {
  position: fixed; inset: 0; z-index: 41; display: flex; align-items: flex-end; justify-content: center;
  pointer-events: none;
}
.sheet {
  pointer-events: auto; width: 100%; max-width: 560px; max-height: 92vh;
  background: #fff; border-radius: 22px 22px 0 0;
  display: flex; flex-direction: column;
  box-shadow: 0 -10px 40px rgba(14, 21, 38, .22);
  animation: slideup .2s ease;
}
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
@keyframes slideup { from { transform: translateY(18px); opacity: .6 } to { transform: none; opacity: 1 } }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 8px;
}
.sheet-head h2 { font-size: 17px; font-weight: 800; letter-spacing: -.4px; }
.sheet-body { overflow-y: auto; padding: 0 16px calc(10px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
.sheet-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 0 14px; margin-top: 12px; border-top: 1px solid var(--line);

 *  xlsx.js — 진짜 .xlsx(Office Open XML) 파일을 만드는 최소 구현

    dv2.setUint16(30, 0, true);
    dv2.setUint16(32, 0, true);
    dv2.setUint16(34, 0, true);
    dv2.setUint16(36, 0, true);

/* 카테고리별 이월 계산 —
 *   한도(M) = 기본예산 + 전월이월(M)
 *   전월이월(M+1) = 이월 ON ? 남은돈(M) : 0
 *   남은돈(M) = 한도(M) − 실제(M)   (초과분 이월 OFF 면 0 아래로는 안 내려감)
 * 시작 월부터 선택한 달까지 차례로 계산한다. */
function rolloverTable(m) {
  var target = isMonthKey(m) ? m : thisMonth();
  var start = isMonthKey(state.settings.startMonth) ? state.settings.startMonth : firstMonth();
  if (start > target) start = target;
  var months = monthsRange(start, target);
  var out = { month: target, start: start, cats: [], total: { budget: 0, carry: 0, limit: 0, actual: 0, left: 0 } };
  var carry = {};
  var expenseCats = catsOf('expense');
  expenseCats.forEach(function (c) { carry[c.id] = 0; });

  months.forEach(function (mm) {
    expenseCats.forEach(function (c) {
      var budget = Math.max(0, int(c.budget));
      var prev = c.roll ? (carry[c.id] || 0) : 0;
      var limit = budget + prev;
      var actual = actualOf(mm, c.id);
      var left = limit - actual;
      var next = c.roll ? (state.settings.negCarry ? left : Math.max(0, left)) : 0;
      carry[c.id] = next;
      if (mm === target) {
        out.cats.push({
          id: c.id, name: c.name, budget: budget, carry: prev, limit: limit,
          actual: actual, left: left, next: next, roll: !!c.roll
        });
      }
    });
  });
  out.cats.forEach(function (r) {
    out.total.budget += r.budget;
    out.total.carry += r.carry;
    out.total.limit += r.limit;
    out.total.actual += r.actual;
    out.total.left += r.left;
  });
  return out;
}

function incomeTable(m) {
  var target = isMonthKey(m) ? m : thisMonth();
  var rows = catsOf('income').map(function (c) {
    var plan = Math.max(0, int(c.plan));
    var actual = actualIncomeOf(target, c.id);
    return { id: c.id, name: c.name, plan: plan, actual: actual, diff: actual - plan };
  });
  var total = { plan: 0, actual: 0, diff: 0 };
  rows.forEach(function (r) { total.plan += r.plan; total.actual += r.actual; total.diff += r.diff; });
  return { month: target, rows: rows, total: total };
}

/* 월별 · 누적 저축 — 누적은 기초 누적 저축 + 그 달까지의 (수입−지출) 합 */
function savingsTable() {
  var start = firstMonth();
  var end = lastMonth();
  var months = monthsRange(start, end);
  var cum = int(state.settings.initialSavings);
  var rows = months.map(function (m) {
    var t = monthTotals(m);
    cum += t.save;
    return { month: m, income: t.income, expense: t.expense, save: t.save, cum: cum };
  });
  var total = rows.reduce(function (a, r) {
    a.income += r.income; a.expense += r.expense; a.save += r.save; return a;
  }, { income: 0, expense: 0, save: 0 });
  var withData = rows.filter(function (r) { return r.income || r.expense; });
  total.avgSave = withData.length ? Math.round(total.save / withData.length) : 0;

}

  var row = null;

  if (!row) {
    var cum = int(state.settings.initialSavings);
    t.rows.forEach(function (r) { if (r.month <= m) cum = r.cum; });
    var mt = monthTotals(m);
    row = { month: m, income: mt.income, expense: mt.expense, save: mt.save, cum: cum + mt.save };
  }
  return { row: row, table: t };
}

function loanSummary() {
  var principal = 0, balance = 0, interest = 0, history = 0;
  state.loans.forEach(function (l) {
    principal += int(l.principal);
    balance += int(l.balance);
    interest += int(l.balance) * num(l.rate) / 100 / 12;
    history += (l.history || []).length;
  });
  var repaid = Math.max(0, principal - balance);
  return {
    count: state.loans.length, principal: principal, balance: Math.round(balance),
    repaid: repaid, rate: principal ? (repaid / principal) * 100 : 0,
    monthlyInterest: Math.round(interest), historyCount: history
  };
}
function loanMonthly(l) { return Math.round(int(l.balance) * num(l.rate) / 100 / 12); }

/* ---------- 거래 조작 ---------- */
function addTx(data) {
  var t = normalize({ cats: state.cats, tx: [data] }).tx[0];
  if (!t) return null;
  t.id = data.id || uid();
  t.ts = Date.now();
  state.tx.unshift(t);
  sortTx();
  saveState();
  syncPushTx(t);
  return t;
}
function updateTx(id, patch) {
  var t = null;
  state.tx.forEach(function (x) { if (x.id === id) t = x; });
  if (!t) return null;
  var merged = normalize({
    cats: state.cats,
    tx: [Object.assign({}, t, patch, { id: id })]
  }).tx[0];
  if (!merged) return null;
  merged.id = id;
  merged.ts = Date.now();
  for (var i = 0; i < state.tx.length; i++) if (state.tx[i].id === id) state.tx[i] = merged;
  sortTx();
  saveState();
  syncPushTx(merged);
  return merged;
}
function delTx(id) {
  var before = state.tx.length;
  state.tx = state.tx.filter(function (t) { return t.id !== id; });
  if (state.tx.length === before) return false;
  saveState();
  syncRemoveTx(id);
  return true;
}
function sortTx() {
  state.tx.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.ts || 0) - (a.ts || 0); });
}

/* ---------- 대출 조작 ---------- */
function addLoan(data) {

}
function updateLoan(id, patch) {
  var l = null;
  state.loans.forEach(function (x) { if (x.id === id) l = x; });
  if (!l) return null;
  var st = normalize({ cats: state.cats, loans: [Object.assign({}, l, patch, { id: id, history: l.history })] });
  if (!st.loans[0]) return null;
  var merged = st.loans[0];
  merged.id = id;
  merged.ts = Date.now();

function delLoan(id) {

/* 상환 기록 — 원금이 줄고, 원하면 지출로도 남긴다 */
function repayLoan(id, info) {
  var l = null;
  state.loans.forEach(function (x) { if (x.id === id) l = x; });
  if (!l) return null;
  var amount = Math.abs(int(info && info.amount));
  if (!amount) return null;
  var interest = Math.max(0, int(info && info.interest));
  var principalPart = Math.max(0, amount - interest);
  var applied = Math.min(principalPart, int(l.balance));
  l.balance = Math.max(0, int(l.balance) - applied);
  l.history = (l.history || []).concat([{
    id: uid(),
    date: /^\d{4}-\d{2}-\d{2}$/.test(String((info && info.date) || '')) ? String(info.date).slice(0, 10) : todayKey(),
    amount: amount,
    interest: interest,
    memo: String((info && info.memo) || '').slice(0, 60)
  }]);
  l.ts = Date.now();
  saveState();
  syncPushLoan(l);
  var tx = null;
  if (info && info.asExpense) {
    tx = addTx({
      date: (info.date || todayKey()),
      type: 'expense',
      amount: amount,
      desc: l.name + ' 상환',
      memo: info.memo || '',
      cat: info.cat || (catsOf('expense')[2] || {}).id,
      pay: '계좌이체'
    });
  }
  return { loan: l, tx: tx, applied: applied };
}

/* ------------------------------------------------------------------ *
 *  sync.js — 남편과 실시간 연동 (Firebase Realtime Database, REST + SSE)
 *    rooms/{room}/tx/{id}.json       거래 한 건
 *    rooms/{room}/loans/{id}.json    대출 한 건
 *    rooms/{room}/meta.json          카테고리·예산·이월·설정
 *    rooms/{room}/removed/{id}.json  지운 기록 표시(되살아나지 않게)
 * ------------------------------------------------------------------ */

var sync = {
  room: '', key: '', es: null, stream: 'idle', pending: 0, retry: 0,
  error: '', applying: false, lastSync: 0, timer: null
};

var TOMB_STORE = 'household_budget_tomb_v1';

function tombGet() {
  try {
    var o = JSON.parse(lsGet(TOMB_STORE) || '{}');
    return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  } catch (e) { return {}; }
}
function tombSet(id, at) {
  var t = tombGet();
  t[id] = at;
  lsSet(TOMB_STORE, JSON.stringify(t));
}
function tombHas(id) { return !!tombGet()[id]; }
function tombAt(id) { return int(tombGet()[id]); }

function utf8Hex(s) {
  var enc = '';
  try { enc = encodeURIComponent(String(s)); } catch (e) { return ''; }
  var out = '', i = 0;
  while (i < enc.length) {
    var ch = enc.charAt(i);
    if (ch === '%') { out += enc.substr(i + 1, 2).toLowerCase(); i += 3; }
    else { out += ('0' + enc.charCodeAt(i).toString(16)).slice(-2); i += 1; }
  }
  return out;
}
function utf8FromHex(h) {
  var s = '';
  for (var i = 0; i < h.length; i += 2) s += '%' + h.substr(i, 2);
  try { return decodeURIComponent(s); } catch (e) { return h; }
}
/* 코드 → Firebase 키: 영문·숫자·-·_ 만 그대로, 한글·공백·기호는 UTF-8 16진수 */
function syncEncodeRoom(raw) {
  var code = String(raw == null ? '' : raw).trim();
  if (!code) return '';
  if (/^[A-Za-z0-9_-]{1,64}$/.test(code)) return code.toLowerCase();
  return 'u-' + utf8Hex(code).slice(0, 360);
}
function syncDecodeRoom(key) {
  var k = String(key || '');
  return k.indexOf('u-') === 0 ? utf8FromHex(k.slice(2)) : k;
}
function randCode(n, prefix) {
  var chars = 'abcdefghjkmnpqrstuvwxyz23456789';
  var buf = null;
  try {
    if (window.crypto && window.crypto.getRandomValues) { buf = new Uint32Array(n); window.crypto.getRandomValues(buf); }
  } catch (e) { buf = null; }
  var out = '';
  for (var i = 0; i < n; i++) out += chars.charAt((buf ? buf[i] : Math.floor(Math.random() * 4294967296)) % chars.length);
  return (prefix || '') + out;
}

function syncStatus() {
  if (!sync.key) return 'off';
  if (sync.pending > 0) return 'sync';
  if (sync.stream === 'open') return 'live';
  if (sync.stream === 'down' || sync.error) return 'offline';
  return 'connecting';
}
function syncStatusText() {
  var s = syncStatus();
  if (s === 'off') return '혼자';
  if (s === 'sync') return '동기화 중';
  if (s === 'offline') return '오프라인';
  return '연동 중';
}
function syncStatusIcon() {
  var s = syncStatus();
  return s === 'off' ? '☁️' : '💑';
}
function refreshSyncStatus() {
  var pill = document.getElementById('syncpill');
  var s = syncStatus();
  if (pill) {
    pill.setAttribute('data-status', s);
    pill.setAttribute('aria-label', '가족 연동 — ' + syncStatusText());
    var lb = pill.querySelector('.lbl2');
    if (lb) lb.textContent = syncStatusText();
    var ic = pill.querySelector('.sicon');
    if (ic) ic.textContent = syncStatusIcon();
  }
  var box = document.getElementById('syncBox');
  if (box) {
    box.setAttribute('data-status', s);
    var b = box.querySelector('b');
    if (b) b.textContent = syncStatusText();
  }
}

function dbFetch(path, opts) {
  if (typeof window.fetch !== 'function') return Promise.reject(new Error('no fetch'));
  return window.fetch(DB_URL + path, opts).then(function (res) {
    if (!res || res.ok === false) {
      var err = new Error('HTTP ' + (res && res.status ? res.status : '?'));
      err.status = (res && res.status) || 0;
      throw err;
    }
    return res.text();
  }).then(function (txt) {
    if (!txt) return null;
    try { return JSON.parse(txt); } catch (e) { return null; }
  });
}
function dbPath(key, sub) { return '/rooms/' + key + (sub ? '/' + sub : '') + '.json'; }
function syncPut(path, value) {
  return dbFetch(path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(value) });
}
function syncDel(path) { return dbFetch(path, { method: 'DELETE' }); }
function syncGet(path) { return dbFetch(path, { method: 'GET', cache: 'no-store' }); }

function withPending(fn) {
  sync.pending++;
  refreshSyncStatus();
  var p;
  try { p = fn(); } catch (e) { p = Promise.reject(e); }
  return Promise.resolve(p).then(function (v) {
    sync.pending = Math.max(0, sync.pending - 1);
    refreshSyncStatus();
    return v;
  }, function (e) {
    sync.pending = Math.max(0, sync.pending - 1);
    refreshSyncStatus();
    throw e;
  });
}
function syncFail(err) {
  sync.error = (err && err.status) ? ('HTTP ' + err.status) : String((err && err.message) || 'error');
  sync.stream = sync.stream === 'open' ? 'open' : 'down';
  refreshSyncStatus();
}

function metaPayload() {
  return {
    cats: state.cats,
    settings: state.settings,
    updatedAt: Date.now()
  };
}
function syncPushMeta() {
  if (!sync.key || sync.applying) return Promise.resolve(false);
  var key = sync.key;
  return withPending(function () {
    return syncPut(dbPath(key, 'meta'), metaPayload()).then(function () {
      return syncPut(dbPath(key, 'updatedAt'), Date.now());
    });
  }).then(function () {
    sync.error = '';
    metaSet({ lastPushAt: Date.now(), lastSync: Date.now() });
    refreshSyncStatus();
    return true;
  }, function (err) { syncFail(err); return false; });
}
function syncPushTx(t) {
  if (!sync.key || sync.applying || !t) return Promise.resolve(false);
  var key = sync.key;
  return withPending(function () {
    return syncPut(dbPath(key, 'tx/' + t.id), t).then(function () {
      return syncPut(dbPath(key, 'updatedAt'), Date.now());
    });
  }).then(function () {
    sync.error = '';
    metaSet({ lastPushAt: Date.now(), lastSync: Date.now() });
    refreshSyncStatus();
    return true;
  }, function (err) { syncFail(err); return false; });
}
function syncRemoveTx(id) {
  if (!sync.key || !id) return Promise.resolve(false);
  var key = sync.key;
  var at = Date.now();
  tombSet(id, at);
  return withPending(function () {
    return syncPut(dbPath(key, 'removed/' + id), at).then(function () {
      return syncDel(dbPath(key, 'tx/' + id));
    });
  }).then(function () {
    sync.error = '';
    refreshSyncStatus();
    return true;
  }, function (err) { syncFail(err); return false; });
}
function syncPushLoan(l) {
  if (!sync.key || sync.applying || !l) return Promise.resolve(false);
  var key = sync.key;
  return withPending(function () {
    return syncPut(dbPath(key, 'loans/' + l.id), l).then(function () {
      return syncPut(dbPath(key, 'updatedAt'), Date.now());
    });
  }).then(function () {
    sync.error = '';
    metaSet({ lastPushAt: Date.now(), lastSync: Date.now() });
    refreshSyncStatus();
    return true;
  }, function (err) { syncFail(err); return false; });
}
function syncRemoveLoan(id) {
  if (!sync.key || !id) return Promise.resolve(false);
  var key = sync.key;
  tombSet(id, Date.now());
  return withPending(function () {
    return syncPut(dbPath(key, 'removed/' + id), Date.now()).then(function () {
      return syncDel(dbPath(key, 'loans/' + id));
    });

    '<div class="hs-row"><span>남은 한도</span><b class="' + (roll.total.left < 0 ? 'neg' : '') + '">' + won(roll.total.left) + '</b></div>' +
    '<div class="hs-row"><span>기록</span><b>' + tot.count + '건</b></div>' +
    '</div>' +
    '</section>';

  var goalCard = '<section class="card goalcard">' +
    '<div class="card-head"><h2>소비 목표</h2>' +

  var planCard = '<section class="card plancard">' +
    '<div class="card-head"><h2>계획 vs 실제</h2><span class="muted">' + monthLabel(ui.month) + '</span></div>' +
    '<div class="planrow">' +
    '<div class="pl-top"><span>지출</span><b>' + fmt(roll.total.actual) + ' <em>/ ' + fmt(roll.total.limit) + '</em></b></div>' +
    '<div class="bar"><i class="fill ' + (roll.total.limit && roll.total.actual > roll.total.limit ? 'over' : '') + '" style="width:' +
    (roll.total.limit ? clamp(roll.total.actual / roll.total.limit * 100, 0, 100).toFixed(1) : 0) + '%"></i></div>' +
    '</div>' +
    '<div class="planrow">' +
    '<div class="pl-top"><span>수입</span><b>' + fmt(inc.total.actual) + ' <em>/ ' + fmt(inc.total.plan) + '</em></b></div>' +
    '<div class="bar"><i class="fill income" style="width:' +
    (inc.total.plan ? clamp(inc.total.actual / inc.total.plan * 100, 0, 100).toFixed(1) : 0) + '%"></i></div>' +
    '</div>' +
    '</section>';

  var catCard = '<section class="card catcard">' +
    '<div class="card-head"><h2>카테고리별 계획 · 이월</h2>' +
    '<button type="button" class="linkbtn" data-act="openBudget">예산 설정</button></div>' +
    '<div class="ptable">' +
    '<div class="ptable-head"><span>카테고리</span><span>기본예산</span><span>전월이월</span><span>한도</span><span>실제</span><span>남은돈</span></div>' +
    roll.cats.map(function (c) {
      return '<div class="prow" data-cat="' + c.id + '">' +
        '<span class="pname"><i class="dot" style="background:' + catColor(c.id) + '"></i>' + esc(c.name) +
        (c.roll ? '<em class="rolltag">이월</em>' : '') + '</span>' +
        '<span class="pnum">' + fmt(c.budget) + '</span>' +
        '<span class="pnum' + (c.carry ? ' carry' : '') + '">' + (c.carry ? signed(c.carry) : '—') + '</span>' +
        '<span class="pnum">' + fmt(c.limit) + '</span>' +
        '<span class="pnum">' + fmt(c.actual) + '</span>' +
        '<span class="pnum ' + (c.left < 0 ? 'neg' : 'pos') + '"><b>' + signed(c.left) + '</b></span>' +
        '<span class="pbar-mini"><i style="width:' + (c.limit ? clamp(c.actual / c.limit * 100, 0, 100).toFixed(1) : 0) + '%"></i></span>' +
        '</div>';
    }).join('') +
    '<div class="prow ptotal"><span class="pname">합계</span>' +
    '<span class="pnum">' + fmt(roll.total.budget) + '</span>' +
    '<span class="pnum">' + (roll.total.carry ? signed(roll.total.carry) : '—') + '</span>' +
    '<span class="pnum">' + fmt(roll.total.limit) + '</span>' +
    '<span class="pnum">' + fmt(roll.total.actual) + '</span>' +
    '<span class="pnum ' + (roll.total.left < 0 ? 'neg' : 'pos') + '"><b>' + signed(roll.total.left) + '</b></span>' +
    '<span class="pbar-mini"></span></div>' +
    '</div>' +
    '<p class="table-note">이월은 ' + monthLabel(roll.start) + '부터 차례로 계산해요. 남은돈이 다음 달 한도에 더해집니다.</p>' +
    '</section>';

  return monthBar() + '<div class="dash">' +
    '<div class="col left">' + hero + goalCard + planCard + '</div>' +

}

/* ---------- 거래 ---------- */
function filteredTx() {
  var q = String(ui.q || '').trim().toLowerCase();
  return state.tx.filter(function (t) {
    if (monthOf(t.date) !== ui.month) return false;
    if (ui.filterType !== 'all' && t.type !== ui.filterType) return false;
    if (ui.filterCat && t.cat !== ui.filterCat) return false;
    if (ui.filterPay && t.pay !== ui.filterPay) return false;
    if (q) {
      var hay = (t.desc + ' ' + t.memo + ' ' + catName(t.cat) + ' ' + t.amount + ' ' + (t.pay || '')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}
function txPanel(compact) {
  var list = filteredTx();
  var exp = sumOf(list, 'expense');
  var inc = sumOf(list, 'income');
  var cats = catsOf('expense').concat(catsOf('income'));
  var pays = PAY_METHODS.filter(function (p) {
    return state.tx.some(function (t) { return t.pay === p; });
  });

  var toolbar = '<div class="txtools">' +
    '<div class="searchbox">' + icon('search', 17) +
    '<input type="search" class="txsearch" data-search placeholder="설명 · 메모로 찾기" value="' + esc(ui.q) + '" aria-label="거래 검색">' +
    '</div></div>' +
    '<div class="txfilters">' +
    '<div class="seg small" role="group" aria-label="구분">' +
    ['all', 'expense', 'income'].map(function (k) {
      var lab = k === 'all' ? '전체' : k === 'expense' ? '지출' : '수입';
      return '<button type="button" class="segbtn' + (ui.filterType === k ? ' on' : '') + '" data-act="setFilterType" data-type="' + k + '">' + lab + '</button>';
    }).join('') + '</div>' +
    '<select class="minisel" data-act="setFilterCat" aria-label="카테고리">' +
    '<option value="">카테고리 전체</option>' +
    cats.map(function (c) {
      return '<option value="' + c.id + '"' + (ui.filterCat === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join('') + '</select>' +
    '<select class="minisel" data-act="setFilterPay" aria-label="결제수단">' +
    '<option value="">결제수단 전체</option>' +
    pays.map(function (p) {
      return '<option value="' + esc(p) + '"' + (ui.filterPay === p ? ' selected' : '') + '>' + esc(p) + '</option>';
    }).join('') + '</select>' +
    (ui.q || ui.filterCat || ui.filterPay || ui.filterType !== 'all'
      ? '<button type="button" class="linkbtn" data-act="clearFilter">초기화</button>' : '') +
    '</div>';

  var head = '<div class="card-head"><h2>거래 내역</h2>' +
    '<span class="muted">' + list.length + '건 · 지출 ' + fmt(exp) + ' · 수입 ' + fmt(inc) + '</span></div>';

  var body = txBodyHtml(list);

  return '<section class="card txpanel' + (compact ? ' compact' : '') + '" data-txpanel>' + head + toolbar +
    '<div data-txbody>' + body + '</div>' +
    (compact && list.length > 8 ? '<button type="button" class="linkbtn more" data-act="setTab" data-tab="tx">전체 거래 보기 →</button>' : '') +
    '</section>';
}
function viewTx() {
  var t = monthTotals(ui.month);
  return monthBar() +
    '<div class="txsum">' +
    '<div class="tchip"><span>수입</span><b class="pos">' + fmt(t.income) + '</b></div>' +
    '<div class="tchip"><span>지출</span><b>' + fmt(t.expense) + '</b></div>' +
    '<div class="tchip"><span>저축</span><b class="' + moneyClass(t.save) + '">' + signed(t.save) + '</b></div>' +
    '</div>' + txPanel(false);
}

/* ---------- 대출 ---------- */
function viewLoans() {
  var sum = loanSummary();
  var hero = '<section class="card loanhero">' +
    '<span class="hero-k">총 대출 잔액</span>' +
    '<div class="hero-amt">' + won(sum.balance) + '</div>' +
    '<div class="loanmeta">' +
    '<div><span>원금 합계</span><b>' + fmt(sum.principal) + '원</b></div>' +
    '<div><span>갚은 원금</span><b>' + fmt(sum.repaid) + '원</b></div>' +
    '<div><span>월 예상 이자</span><b>' + fmt(sum.monthlyInterest) + '원</b></div>' +
    '</div>' +
    '<div class="repayline"><span>상환률 <b>' + sum.rate.toFixed(1) + '%</b></span>' +
    '<div class="bar big"><i class="fill income" style="width:' + clamp(sum.rate, 0, 100).toFixed(1) + '%"></i></div></div>' +

  var listCard = '<section class="card loancard">' +
    '<div class="card-head"><h2>대출 목록</h2>' +

    (state.loans.length ? state.loans.map(function (l) {
      var paidPct = int(l.principal) ? clamp((int(l.principal) - int(l.balance)) / int(l.principal) * 100, 0, 100) : 0;
      var hist = (l.history || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      return '<div class="loanrow" data-loan="' + l.id + '">' +
        '<div class="loanrow-top">' +
        '<div class="lnm"><b>' + esc(l.name) + '</b>' +
        '<em>' + (l.payDay ? '매월 ' + l.payDay + '일 · ' : '') + '연 ' + (Math.round(num(l.rate) * 100) / 100) + '% · 월 이자 ' + fmt(loanMonthly(l)) + '원</em></div>' +
        '<div class="lamt"><b>' + won(l.balance) + '</b><em>원금 ' + fmt(l.principal) + '원</em></div>' +
        '</div>' +
        '<div class="bar"><i class="fill income" style="width:' + paidPct.toFixed(1) + '%"></i></div>' +
        (l.memo ? '<p class="loanmemo">' + esc(l.memo) + '</p>' : '') +
        '<div class="loanacts">' +
        '<button type="button" class="btn sm" data-act="openRepay" data-id="' + l.id + '">상환 기록</button>' +
        '<button type="button" class="btn ghost sm" data-act="openLoanEdit" data-id="' + l.id + '">수정</button>' +
        '</div>' +
        (hist.length ? '<details class="loanthist"><summary>상환이력 ' + hist.length + '건</summary><ul>' +
          hist.map(function (h) {
            return '<li><span>' + esc(h.date) + (h.memo ? ' · ' + esc(h.memo) : '') + '</span><b>' + fmt(h.amount) + '원' +
              (h.interest ? ' <em>(이자 ' + fmt(h.interest) + ')</em>' : '') + '</b></li>';
          }).join('') + '</ul></details>' : '') +
        '</div>';
    }).join('')
      : '<div class="txempty"><p>등록된 대출이 없어요.</p>' +
      '<button type="button" class="btn primary sm" data-act="openLoan">첫 대출 추가</button></div>') +
    '</section>';

  return hero + listCard;
}

/* ---------- 저축 ---------- */
function viewSavings() {
  var t = savingsTable();
  var cur = null;
  t.rows.forEach(function (r) { if (r.month === ui.month) cur = r; });
  if (!cur) {
    var m = monthTotals(ui.month);
    cur = { month: ui.month, income: m.income, expense: m.expense, save: m.save, cum: t.rows.length ? t.rows[t.rows.length - 1].cum : t.initial };
  }
  var maxAbs = t.rows.reduce(function (a, r) { return Math.max(a, Math.abs(r.save)); }, 1);
  var saveRate = cur.income ? (cur.save / cur.income * 100) : 0;

  var cards = '<div class="scards">' +
    '<div class="card mini"><span>이번 달 저축</span><b class="' + moneyClass(cur.save) + '">' + signed(cur.save) + '원</b>' +
    '<em>수입 ' + fmt(cur.income) + ' − 지출 ' + fmt(cur.expense) + '</em></div>' +
    '<div class="card mini"><span>누적 총 저축</span><b>' + fmt(cur.cum) + '원</b>' +
    '<em>기초 ' + fmt(t.initial) + '원부터</em></div>' +
    '<div class="card mini"><span>월 평균 저축</span><b>' + fmt(t.total.avgSave) + '원</b>' +
    '<em>' + t.total.months + '개월 기준</em></div>' +
    '<div class="card mini"><span>저축률</span><b>' + saveRate.toFixed(0) + '%</b>' +
    '<em>수입 중 남긴 비율</em></div>' +
    '</div>';

  var chart = '<section class="card chartcard"><div class="card-head"><h2>월별 저축</h2>' +
    '<button type="button" class="linkbtn" data-act="openBudget">기초 저축 설정</button></div>' +
    (t.rows.length ? '<div class="chart">' + t.rows.map(function (r) {
      var h = Math.max(2, Math.abs(r.save) / maxAbs * 100);
      return '<div class="cbar" title="' + monthLabel(r.month) + ' ' + signed(r.save) + '원">' +
        '<span class="cval ' + moneyClass(r.save) + '">' + (r.save ? wonShort(r.save) : '') + '</span>' +
        '<div class="ctrack"><i class="' + (r.save < 0 ? 'neg' : 'pos') + '" style="height:' + h.toFixed(1) + '%"></i></div>' +
        '<span class="clab">' + monthLabelShort(r.month) + '</span></div>';
    }).join('') + '</div>' : '<p class="empty-line">기록을 넣으면 달마다 저축이 얼마씩 쌓였는지 보여 드려요.</p>') +
    '</section>';

  var table = '<section class="card savingtable"><div class="card-head"><h2>누적 저축 표</h2>' +
    '<span class="muted">수입 − 지출</span></div>' +
    (t.rows.length ? '<div class="stwrap"><table class="stable">' +
      '<thead><tr><th>연월</th><th class="num">수입</th><th class="num">지출</th><th class="num">월 저축</th><th class="num">누적 저축</th></tr></thead>' +
      '<tbody>' + t.rows.slice().reverse().map(function (r) {
        return '<tr' + (r.month === ui.month ? ' class="cur"' : '') + '>' +
          '<td>' + r.month.replace('-', '.') + '</td>' +
          '<td class="num">' + fmt(r.income) + '</td>' +
          '<td class="num">' + fmt(r.expense) + '</td>' +
          '<td class="num ' + moneyClass(r.save) + '">' + signed(r.save) + '</td>' +
          '<td class="num"><b>' + fmt(r.cum) + '</b></td></tr>';
      }).join('') + '</tbody></table></div>'
      : '<p class="empty-line">아직 기록이 없어요.</p>') +
    '</section>';

  return monthBar() + cards + '<div class="sgap"></div>' + chart + table;
}

/* ---------- 시트 ---------- */
function el(id) { return document.getElementById(id); }
function openSheet(name, data) {
  ui.sheet = name;
  ui.form = data || {};
  renderSheet();
  var first = document.querySelector('#sheetroot .sheet input, #sheetroot .sheet select');
  if (first && !isMobileWidth()) { try { first.focus(); } catch (e) { } }
}
function closeSheet() {
  ui.sheet = null;
  ui.form = {};
  ui.draft = null;
  renderSheet();
}
function renderSheet() {
  var host = el('sheetroot');
  if (!host) return;
  if (document.body && document.body.classList) document.body.classList.toggle('sheet-open', !!ui.sheet);
  if (!ui.sheet) { host.innerHTML = ''; return; }
  var title = '';
  var body = '';
  var s = ui.sheet;
  if (s === 'tx') {
    title = ui.form.id ? '기록 수정' : '기록 추가';
    body = txSheet();
  } else if (s === 'budget') {
    title = '예산 · 이월 설정';
    body = budgetSheet();
  } else if (s === 'loan') {
    title = ui.form.id ? '대출 수정' : '대출 추가';
    body = loanSheet();
  } else if (s === 'repay') {
    title = '상환 기록';
    body = repaySheet();
  } else if (s === 'more') {
    title = '더보기';
    body = moreSheet();
  } else if (s === 'sync') {
    title = '남편과 연동';
    body = syncSheet();
  } else if (s === 'confirm') {
    title = '확인';
    body = confirmSheet();
  }
  host.innerHTML = '<div class="backdrop" data-act="closeSheet"></div>' +
    '<div class="sheetwrap"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
    '<div class="sheet-head"><h2>' + esc(title) + '</h2>' +
    '<button type="button" class="iconbtn" data-act="closeSheet" aria-label="닫기">✕</button></div>' +
    '<div class="sheet-body">' + body + '</div>' +
    '</div></div>';
}

function txSheet() {
  var f = ui.form;
  var type = f.type === 'income' ? 'income' : 'expense';
  var cats = catsOf(type);
  var cat = f.cat || (cats[0] ? cats[0].id : '');
  return '<form data-form="tx" class="sform" novalidate>' +
    '<div class="seg wide" role="group" aria-label="구분">' +
    '<button type="button" class="segbtn' + (type === 'expense' ? ' on' : '') + '" data-act="setTxType" data-type="expense">지출</button>' +
    '<button type="button" class="segbtn' + (type === 'income' ? ' on' : '') + '" data-act="setTxType" data-type="income">수입</button>' +
    '</div>' +
    '<label class="field amount-field"><span class="lbl">금액</span>' +
    '<input name="amount" class="amount-input" inputmode="numeric" data-money autocomplete="off" ' +
    'value="' + (f.amount ? fmt(f.amount) : '') + '" placeholder="0"></label>' +
    '<div class="frow">' +
    '<label class="field"><span class="lbl">날짜</span>' +
    '<input type="date" name="date" value="' + esc(f.date || todayKey()) + '"></label>' +
    '<label class="field"><span class="lbl">카테고리</span><select name="cat">' +
    cats.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === cat ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join('') + '</select></label>' +
    '</div>' +
    '<label class="field"><span class="lbl">설명</span>' +
    '<input name="desc" value="' + esc(f.desc || '') + '" placeholder="' + (type === 'income' ? '예: 급여' : '예: 마트 장보기') + '" autocomplete="off"></label>' +
    (type === 'expense' ? '<div class="field"><span class="lbl">결제수단</span><div class="chiprow">' +
      PAY_METHODS.map(function (p) {
        return '<button type="button" class="chip' + (f.pay === p ? ' on' : '') + '" data-act="setPay" data-pay="' + esc(p) + '">' + esc(p) + '</button>';
      }).join('') + '</div></div>' : '') +
    '<label class="field"><span class="lbl">메모</span>' +
    '<input name="memo" value="' + esc(f.memo || '') + '" placeholder="선택" autocomplete="off"></label>' +
    '<div class="sheet-foot">' +
    (f.id ? '<button type="button" class="btn ghost danger" data-act="deleteTx" data-id="' + f.id + '">삭제</button>' : '<span></span>') +
    '<button type="submit" class="btn primary">저장</button>' +
    '</div>' +
    '</form>';
}

function budgetSheet() {
  if (!ui.draft) {
    ui.draft = {
      cats: state.cats.map(function (c) { return Object.assign({}, c); }),
      settings: Object.assign({}, state.settings)
    };
  }
  var d = ui.draft;
  var expIdx = [], incIdx = [];
  d.cats.forEach(function (c, i) { (c.kind === 'income' ? incIdx : expIdx).push(i); });

  function row(i, c) {
    var isInc = c.kind === 'income';
    return '<div class="catrow" data-row="' + i + '">' +
      '<input class="catname" data-field="name" data-idx="' + i + '" value="' + esc(c.name) + '" aria-label="카테고리 이름">' +
      '<input class="catbudget" data-field="' + (isInc ? 'plan' : 'budget') + '" data-idx="' + i + '" data-money inputmode="numeric" ' +
      'value="' + (num(isInc ? c.plan : c.budget) ? fmt(isInc ? c.plan : c.budget) : '') + '" placeholder="0" aria-label="월 예산">' +
      (isInc ? '<span class="rollcell muted">—</span>'
        : '<button type="button" class="toggle' + (c.roll ? ' on' : '') + '" data-act="toggleRoll" data-idx="' + i + '" ' +
        'aria-pressed="' + (c.roll ? 'true' : 'false') + '">이월</button>') +
      '<button type="button" class="iconbtn tiny" data-act="delCat" data-idx="' + i + '" aria-label="카테고리 삭제">✕</button>' +
      '</div>';
  }

  return '<form data-form="budget" class="sform" novalidate>' +
    '<div class="sect">' +
    '<h3>이번 달 목표</h3>' +
    '<div class="frow">' +
    '<label class="field"><span class="lbl">월 소비 목표</span>' +

/* ---------- 토스트 ---------- */
var toastTimer = null;
function toast(msg) {
  var host = el('toast');
  if (!host) return;
  host.textContent = msg;
  host.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { host.classList.remove('show'); }, 2400);
}

/* ---------- 내려받기 ---------- */
function download(name, blob) {
  try {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      try { URL.revokeObjectURL(url); } catch (e) { }
      if (a.parentNode) a.parentNode.removeChild(a);
    }, 800);
    return true;
  } catch (e) { return false; }
}
function fileStamp() {
  var d = new Date();
  return d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
}
function exportXlsx() {
  var bytes = xlsxBytes(ui.month);
  download('가계부-' + ui.month + '.xlsx', new Blob([bytes], {
    type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  }));
  toast('엑셀 파일을 내려받았어요');
  closeSheet();
  return bytes;
}
function exportCsv() {
  download('가계부-' + ui.month + '.csv', new Blob([csvText(ui.month)], { type: 'text/csv;charset=utf-8' }));
  toast('CSV 파일을 내려받았어요');
  closeSheet();
}
function exportJson() {
  download('가계부-백업-' + fileStamp() + '.json',
    new Blob([JSON.stringify(backupObject(), null, 2)], { type: 'application/json' }));
  toast('백업 파일을 내려받았어요');
  closeSheet();
}

/* ---------- 기록 저장 ---------- */
function currentForm() { return document.querySelector('#sheetroot form'); }
function formValues(form) {
  var out = {};
  if (!form) return out;
  Array.prototype.forEach.call(form.elements, function (f) {
    if (!f.name) return;
    out[f.name] = f.value;
  });
  return out;
}
function submitTx(form) {
  var v = formValues(form);
  var amount = int(v.amount);
  if (!amount) { toast('금액을 넣어 주세요'); return; }
  var editId = ui.form.id || '';
  var data = {
    date: v.date || todayKey(),
    type: ui.form.type === 'income' ? 'income' : 'expense',
    amount: amount,
    cat: v.cat,
    desc: String(v.desc || '').trim(),
    memo: String(v.memo || '').trim(),
    pay: ui.form.pay || ''
  };
  if (editId) updateTx(editId, data);
  else {
    var t = addTx(data);
    if (t) { ui.month = monthOf(t.date); }
  }
  closeSheet();
  render();
  toast(editId ? '고쳤어요' : '기록했어요');
}
function submitBudget(form) {
  var d = ui.draft;
  var v = formValues(form);
  d.settings.maxSpend = Math.max(0, int(v.maxSpend));
  d.settings.initialSavings = int(v.initialSavings);
  d.settings.startMonth = isMonthKey(v.startMonth) ? v.startMonth : '';
  state.cats = d.cats.map(function (c) {
    return c.kind === 'income'
      ? { id: c.id, kind: 'income', name: c.name, plan: Math.max(0, int(c.plan)) }
      : { id: c.id, kind: 'expense', name: c.name, budget: Math.max(0, int(c.budget)), roll: c.roll !== false };
  });
  if (!state.cats.some(function (c) { return c.kind === 'income'; })) {
    defaultCats().filter(function (c) { return c.kind === 'income'; }).forEach(function (c) { state.cats.push(c); });
  }
  if (!state.cats.some(function (c) { return c.kind === 'expense'; })) {
    defaultCats().filter(function (c) { return c.kind === 'expense'; }).forEach(function (c) { state.cats.push(c); });
  }
  state.settings = Object.assign({}, state.settings, d.settings);
  var used = {};
  state.cats.forEach(function (c) {
    if (!c.id) c.id = uid();
    if (used[c.id]) c.id = c.id + '-' + uid().slice(0, 4);
    used[c.id] = 1;
    if (!c.name) c.name = c.kind === 'income' ? '수입' : '지출';
  });
  // 사라진 카테고리의 기록은 '기타'로 옮기지 않고, 그대로 두면 이름이 '기타'로 보인다.
  saveState();
  syncPushMeta();
  ui.draft = null;
  closeSheet();
  render();
  toast('저장했어요');
}
function submitLoan(form) {
  var v = formValues(form);
  var name = String(v.name || '').trim();
  if (!name) { toast('대출 이름을 넣어 주세요'); return; }
  var principal = Math.max(0, int(v.principal));
  var balanceRaw = String(v.balance || '').trim();
  var balance = balanceRaw ? Math.max(0, int(balanceRaw)) : principal;
  if (principal && balance > principal) balance = principal;
  var data = {
    name: name, principal: principal || balance, balance: balance,
    rate: Math.max(0, Math.min(100, num(v.rate))),
    payDay: clamp(int(v.payDay), 0, 31),
    memo: String(v.memo || '').trim()
  };
  if (ui.form.id) updateLoan(ui.form.id, data);
  else addLoan(data);
  closeSheet();
  render();
  toast('저장했어요');
}
function submitRepay(form) {
  var v = formValues(form);
  var amount = int(v.amount);
  if (!amount) { toast('상환 금액을 넣어 주세요'); return; }
  var interest = Math.min(amount, Math.max(0, int(v.interest)));
  var res = repayLoan(ui.form.id, {
    amount: amount, interest: interest, date: v.date, memo: String(v.memo || '').trim(),
    asExpense: !!ui.form.asExpense, cat: v.cat
  });
  closeSheet();
  render();
  if (res) toast('상환 ' + fmt(amount) + '원 · 남은 잔액 ' + fmt(res.loan.balance) + '원');
}

      openSheet('sync');
      render();
      toast(ok ? '가족 방을 만들었어요' : '방은 만들었어요 (연결은 다시 시도할게요)');
    });
    syncStartStream();
    render();
  },
  copyInvite: function () {
    var text = syncInviteLink();
    var done = function (ok) {
      var box = el('inviteBox');
      if (box) { box.select(); }
      toast(ok ? '초대 링크를 복사했어요' : '링크를 길게 눌러 복사해 주세요');
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(legacyCopy(text)); });
        return;
      }
    } catch (e) { }
    done(legacyCopy(text));
  },
  shareInvite: function () {
    var text = syncInviteLink();
    try {
      if (navigator.share) { navigator.share({ title: APP_NAME, text: '가계부 같이 써요', url: text }); return; }
    } catch (e) { }
    actions.copyInvite();
  },
  syncNow: function () {
    syncPull({ quiet: false }).then(function () { toast('맞췄어요'); });
  },
  leaveRoom: function () {
    ui.confirm = {
      text: '이 기기에서 연동만 해제할까요? 기록은 그대로 남아요.', ok: '해제',
      act: function () { syncDisconnect(); closeSheet(); render(); toast('연동을 해제했어요'); }
    };
    openSheet('confirm');
  },
  setFilterType: function (d) { ui.filterType = d.type || 'all'; render(); },
  setFilterCat: function (d, node) { ui.filterCat = node.value; render(); },
  setFilterPay: function (d, node) { ui.filterPay = node.value; render(); },
  clearFilter: function () { ui.filterType = 'all'; ui.filterCat = ''; ui.filterPay = ''; ui.q = ''; render(); },
  exportXlsx: function () { exportXlsx(); },
  exportCsv: function () { exportCsv(); },
  exportJson: function () { exportJson(); },
  askReset: function () {
    ui.confirm = {
      text: '이 기기의 기록을 모두 지울까요? 카테고리와 설정도 처음 상태로 돌아가요.', ok: '모두 지우기',
      act: function () {
        state = emptyState();
        saveState();
        ui.month = thisMonth();
        closeSheet();
        render();
        syncPushAll();
        toast('초기화했어요');
      }
    };
    openSheet('confirm');
  },
  confirmYes: function () {
    var c = ui.confirm;
    ui.confirm = null;
    if (c && typeof c.act === 'function') c.act();
  },
  closeSheet: function () { closeSheet(); }
};

function defaultEntryDate() {
  var m = ui.month;
  var t = todayKey();
  if (monthOf(t) === m) return t;
  return m + '-01';
}
function legacyCopy(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand && document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  } catch (e) { return false; }
}
function syncDraftFromForm(form) {
  if (!ui.draft) return;
  Array.prototype.forEach.call(form.elements, function (f) {
    if (!f.getAttribute || !f.getAttribute('data-field')) return;
    var i = int(f.getAttribute('data-idx'));
    var field = f.getAttribute('data-field');
    var c = ui.draft.cats[i];
    if (!c) return;
    if (field === 'name') c.name = String(f.value || '').slice(0, 20);
    else c[field] = Math.max(0, int(String(f.value || '').replace(/[^0-9]/g, '')));
  });
  var maxSpend = document.querySelector('#sheetroot [name="maxSpend"]');
  var initial = document.querySelector('#sheetroot [name="initialSavings"]');
  var start = document.querySelector('#sheetroot [name="startMonth"]');
  if (maxSpend) ui.draft.settings.maxSpend = Math.max(0, int(maxSpend.value));
  if (initial) ui.draft.settings.initialSavings = int(initial.value);
  if (start) ui.draft.settings.startMonth = isMonthKey(start.value) ? start.value : '';
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', function (e) {
  var node = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!node) return;
  var act = node.getAttribute('data-act');
  if (!act) return;
  if (node.tagName === 'SELECT') return;
  e.preventDefault();
  var fn = actions[act];
  if (fn) fn(node.dataset || {}, node);
});

document.addEventListener('change', function (e) {
  var node = e.target;
  if (!node) return;
  if (node.id === 'importFile') {
    var file = node.files && node.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var obj = JSON.parse(String(reader.result || '{}'));
        importObject(obj);
        closeSheet();
        render();
        toast('불러왔어요');
      } catch (err) { toast('파일을 읽지 못했어요'); }
    };
    reader.readAsText(file);
    return;
  }
  var act = node.getAttribute && node.getAttribute('data-act');
  if (act === 'setFilterCat' || act === 'setFilterPay') {
    actions[act](node.dataset || {}, node);
  }
});

document.addEventListener('input', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute) return;
  if (t.classList && t.classList.contains('txsearch')) {
    ui.q = t.value;
    refreshTxBodies();
    return;
  }
  if (t.getAttribute('data-field')) {
    var i = int(t.getAttribute('data-idx'));
    var field = t.getAttribute('data-field');
    var c = ui.draft && ui.draft.cats[i];
    if (c) {
      if (field === 'name') c.name = t.value.slice(0, 20);
      else c[field] = Math.max(0, int(digits(t.value)));
    }
  }
  if (t.hasAttribute('data-money')) {
    var d = digits(t.value).slice(0, 12);
    t.value = d ? fmt(d) : '';
    updateLivePreview();
  }
});

document.addEventListener('submit', function (e) {
  var form = e.target;
  if (!form || !form.getAttribute) return;
  var kind = form.getAttribute('data-form');
  if (!kind) return;
  e.preventDefault();
  if (kind === 'tx') submitTx(form);
  else if (kind === 'budget') submitBudget(form);
  else if (kind === 'loan') submitLoan(form);
  else if (kind === 'repay') submitRepay(form);
  else if (kind === 'joinRoom') {
    var v = formValues(form);
    var code = String(v.code || '').trim();
    if (!code) { toast('가족 코드를 넣어 주세요'); return; }
    setSyncRoom(code);
    closeSheet();
    syncConnect();
    render();
    toast('방에 연결하는 중이에요');
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && ui.sheet) closeSheet();
});

function updateLivePreview() {
  var form = currentForm();
  if (!form) return;
  if (ui.sheet === 'repay') {
    var id = ui.form.id;
    var l = null;
    state.loans.forEach(function (x) { if (x.id === id) l = x; });
    var box = document.getElementById('repayPreview');
    if (!l || !box) return;
    var v = formValues(form);
    var amount = int(v.amount);
    var interest = Math.min(amount, Math.max(0, int(v.interest)));
    var after = Math.max(0, int(l.balance) - Math.max(0, amount - interest));
    box.textContent = amount
      ? '원금 ' + fmt(Math.max(0, amount - interest)) + '원이 줄어 남은 잔액은 ' + won(after) + '원이 돼요.'
      : '상환하면 남은 잔액이 ' + won(l.balance) + '원이 돼요.';
  } else if (ui.sheet === 'loan') {
    var v2 = formValues(form);
    var box2 = document.getElementById('loanPreview');
    if (box2) box2.textContent = loanPreviewText({ principal: v2.principal, balance: v2.balance, rate: v2.rate });
  }
}
function refreshTxBodies() {
  var list = filteredTx();
  var html = txBodyHtml(list);
  Array.prototype.forEach.call(document.querySelectorAll('[data-txbody]'), function (host) {
    host.innerHTML = html;
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-txpanel] .card-head .muted'), function (m) {
    m.textContent = list.length + '건 · 지출 ' + fmt(sumOf(list, 'expense')) + ' · 수입 ' + fmt(sumOf(list, 'income'));
  });
}
function txBodyHtml(list) {
  if (!list.length) {
    return '<div class="txempty"><p>' + (state.tx.length ? '조건에 맞는 기록이 없어요.' : '이번 달 기록이 아직 없어요.') + '</p>' +
      '<button type="button" class="btn primary sm" data-act="openTx">' + icon('plus', 16) + '첫 기록 추가</button></div>';
  }
  var groups = [], byDate = {};
  list.forEach(function (t) {
    if (!byDate[t.date]) { byDate[t.date] = []; groups.push(t.date); }
    byDate[t.date].push(t);
  });
  var cards = '<div class="txcards" data-txcards>' + groups.map(function (d) {
    var items = byDate[d];
    var dayExp = sumOf(items, 'expense');
    var dayInc = sumOf(items, 'income');
    return '<div class="daygroup"><div class="dayhead"><span>' + dateLabel(d) + '</span><em>' +
      (dayInc ? '+' + fmt(dayInc) + ' ' : '') + (dayExp ? '−' + fmt(dayExp) : '') + '</em></div>' +
      items.map(function (t) {
        return '<button type="button" class="txrow" data-act="openTxEdit" data-id="' + t.id + '">' +
          '<i class="dot" style="background:' + catColor(t.cat) + '"></i>' +
          '<span class="txmain"><b>' + esc(t.desc || catName(t.cat)) + '</b>' +
          '<em>' + esc(catName(t.cat)) + (t.pay ? ' · ' + esc(t.pay) : '') + (t.memo ? ' · ' + esc(t.memo) : '') + '</em></span>' +
          '<span class="txamt ' + (t.type === 'income' ? 'pos' : '') + '">' +
          (t.type === 'income' ? '+' : '−') + fmt(t.amount) + '</span></button>';
      }).join('') + '</div>';
  }).join('') + '</div>';
  var table = '<div class="txtablewrap"><table class="txtable"><thead><tr><th>날짜</th><th>구분</th><th>카테고리</th>' +
    '<th>설명 · 결제수단</th><th class="num">금액</th></tr></thead><tbody>' +
    list.map(function (t) {
      var sub = [];
      if (t.type === 'expense' && t.pay) sub.push(t.pay);
      if (t.memo) sub.push(t.memo);
      return '<tr data-act="openTxEdit" data-id="' + t.id + '">' +
        '<td class="nowrap">' + esc(dayLabel(t.date)) + '</td>' +
        '<td><span class="tag ' + (t.type === 'income' ? 'in' : 'out') + '">' + (t.type === 'income' ? '수입' : '지출') + '</span></td>' +
        '<td class="nowrap"><i class="dot" style="background:' + catColor(t.cat) + '"></i>' + esc(catName(t.cat)) + '</td>' +
        '<td class="desc">' + esc(t.desc || '') + (sub.length ? ' <em class="memo">' + esc(sub.join(' · ')) + '</em>' : '') + '</td>' +
        '<td class="num ' + (t.type === 'income' ? 'pos' : '') + '">' + (t.type === 'income' ? '+' : '−') + fmt(t.amount) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  return cards + table;
}

window.addEventListener('focus', function () {
  if (sync.key && syncStatus() !== 'sync') syncPull({ quiet: true });
});
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && sync.key && syncStatus() !== 'sync') syncPull({ quiet: true });
});

/* ---------- 시작 ---------- */
function boot() {
  state = loadState();
  if (!isMonthKey(ui.month)) ui.month = thisMonth();
  ui.month = clampMonth(ui.month);
  render();
  bootSync();
}

boot();

/* 테스트용 훅 (앱 동작에는 영향 없음) */
window.__budgetApp = {
  get state() { return state; },
  set state(v) { state = normalize(v); saveState(); render(); },
  get ui() { return ui; },
  APP_NAME: APP_NAME, DB_URL: DB_URL, INVITE_BASE: INVITE_BASE,
  render: render, openSheet: openSheet, closeSheet: closeSheet,
  addTx: addTx, updateTx: updateTx, delTx: delTx,
  addLoan: addLoan, updateLoan: updateLoan, delLoan: delLoan, repayLoan: repayLoan,
  rolloverTable: rolloverTable, incomeTable: incomeTable, savingsTable: savingsTable, savingsOf: savingsOf,
  loanSummary: loanSummary, monthTotals: monthTotals, loanMonthly: loanMonthly,
  xlsxBytes: xlsxBytes, xlsxSheets: xlsxSheets, csvText: csvText,
  exportXlsx: exportXlsx, exportCsv: exportCsv, exportJson: exportJson,
  backupObject: backupObject, importObject: importObject,
  seedState: seedState, emptyState: emptyState, normalize: normalize,
  setMonth: setMonth, actions: actions,
  sync: sync, syncStatusText: syncStatusText, syncPull: syncPull, syncPushAll: syncPushAll,
  syncPushTx: syncPushTx, syncDisconnect: syncDisconnect, setSyncRoom: setSyncRoom,
  syncEncodeRoom: syncEncodeRoom, syncDecodeRoom: syncDecodeRoom, syncInviteLink: syncInviteLink,
  mergeRecords: mergeRecords, applyStreamEvent: applyStreamEvent,
  helpers: {
    fmt: fmt, won: won, digits: digits, int: int, num: num, monthKey: monthOf, addMonths: addMonths,
    monthLabel: monthLabel, todayKey: todayKey, dateLabel: dateLabel, monthsRange: monthsRange,
    catName: catName, catColor: catColor, clamp: clamp, pct: pct
  }
};

})();

</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
